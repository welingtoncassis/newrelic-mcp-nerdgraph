name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Never paste an API key or real telemetry. Redact ids and hostnames.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The tool call or prompt, including arguments.
      render: json
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.4"
    validations:
      required: true

  - type: dropdown
    id: client
    attributes:
      label: MCP client
      options: [Cursor, Claude Desktop, Claude Code, VS Code, Custom, Other]
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of running with `--log-level DEBUG`, redacted.
      render: shell
